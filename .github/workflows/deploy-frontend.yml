name: Deploy Frontend to Azure

on:
  push:
    branches:
      - deployment-one-doc
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: clinicos-frontend
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspace=frontend

      - name: Build frontend (standalone)
        env:
          NEXT_PUBLIC_API_URL: https://clinicos-backend.azurewebsites.net
        run: npm run build --workspace=frontend

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          
          # Copy standalone output
          cp -r frontend/.next/standalone/* deploy/ 2>/dev/null || true
          cp -r frontend/.next/standalone/. deploy/ 2>/dev/null || true
          
          # Patch Next.js standalone server to support iisnode Named Pipes on Windows
          node << 'EOF'
          const fs = require('fs');
          const file = 'deploy/frontend/server.js';
          let content = fs.readFileSync(file, 'utf8');
          content = content.replace('parseInt(process.env.PORT, 10)', 'process.env.PORT');
          content = content.replace("const hostname = process.env.HOSTNAME || '0.0.0.0'", "const hostname = (process.env.PORT && process.env.PORT.includes('pipe')) ? undefined : (process.env.HOSTNAME || '0.0.0.0')");
          fs.writeFileSync(file, content, 'utf8');
          EOF
          
          # Copy static assets
          mkdir -p deploy/frontend/.next/static
          cp -r frontend/.next/static/* deploy/frontend/.next/static/ 2>/dev/null || true
          
          # Copy public folder
          mkdir -p deploy/frontend/public
          cp -r frontend/public/* deploy/frontend/public/ 2>/dev/null || true
          
          # Create startup script
          cat > deploy/server.js << 'EOF'
          // Azure App Service entry point for Next.js standalone
          const path = require('path');
          process.chdir(path.join(__dirname, 'frontend'));
          process.env.PORT = process.env.PORT || '8080';
          process.env.HOSTNAME = (process.env.PORT && process.env.PORT.includes('pipe')) ? '' : '0.0.0.0';
          require('./frontend/server.js');
          EOF

          # Create web.config for IISNode (Required for Windows App Service)
          cat > deploy/web.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <handlers>
                <add name="iisnode" path="server.js" verb="*" modules="iisnode"/>
              </handlers>
              <rewrite>
                <rules>
                  <rule name="NodeInspector" patternSyntax="ECMAScript" stopProcessing="true">
                    <match url="^server.js\/debug[\/]?" />
                  </rule>
                  <rule name="StaticContent">
                    <action type="Rewrite" url="public{REQUEST_URI}"/>
                  </rule>
                  <rule name="DynamicContent">
                    <conditions>
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="True"/>
                    </conditions>
                    <action type="Rewrite" url="server.js"/>
                  </rule>
                </rules>
              </rewrite>
              <iisnode watchedFiles="web.config;*.js" node_env="production" devErrorsEnabled="true" loggingEnabled="true" logDirectory="C:\home\LogFiles\iisnode" nodeProcessCommandLine="C:\home\site\wwwroot\node_copy.exe" />
            </system.webServer>
          </configuration>
          EOF

          # Create .deployment config to use custom deploy script
          cat > deploy/.deployment << 'EOF'
          [config]
          command = deploy.cmd
          EOF

          # Create custom deploy.cmd to copy Node.js version and run KuduSync
          cat > deploy/deploy.cmd << 'EOF'
          @echo off
          echo --- Custom Deployment Script ---

          :: 1. Copy the active Node.js version to C:\home\site\wwwroot\node_copy.exe
          echo Finding Node.js 22...
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$nodePaths = where.exe node; $targetPath = $null; foreach ($path in $nodePaths) { if ($path -like '*\nodejs\2*') { $targetPath = $path; break } }; if (-not $targetPath) { $targetPath = $nodePaths[0] }; Write-Output ('Copying from ' + $targetPath + ' to C:\home\site\wwwroot\node_copy.exe'); Copy-Item -Path $targetPath -Destination 'C:\home\site\wwwroot\node_copy.exe' -Force -ErrorAction SilentlyContinue"

          :: 2. Run Kudusync to copy the deployment files
          echo Running KuduSync...
          if "%IN_PLACE_DEPLOYMENT%" NEQ "1" (
            "%KUDU_SYNC_CMD%" -v 50 -f "%DEPLOYMENT_SOURCE%" -t "%DEPLOYMENT_TARGET%" -n "%NEXT_MANIFEST_PATH%" -p "%PREVIOUS_MANIFEST_PATH%" -i ".git;.hg;.deployment;deploy.cmd"
          )

          echo Deployment completed successfully.
          EOF


      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: deploy
