name: Deploy Frontend to Azure

on:
  push:
    branches:
      - deployment-one-doc
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: clinicos-frontend
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspace=frontend

      - name: Build frontend (standalone)
        env:
          NEXT_PUBLIC_API_URL: https://clinicos-backend.azurewebsites.net
        run: npm run build --workspace=frontend

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          
          # Copy standalone output
          cp -r frontend/.next/standalone/* deploy/ 2>/dev/null || true
          cp -r frontend/.next/standalone/. deploy/ 2>/dev/null || true
          
          # Copy static assets
          mkdir -p deploy/frontend/.next/static
          cp -r frontend/.next/static/* deploy/frontend/.next/static/ 2>/dev/null || true
          
          # Copy public folder
          mkdir -p deploy/frontend/public
          cp -r frontend/public/* deploy/frontend/public/ 2>/dev/null || true
          
          # Create startup script
          cat > deploy/server.js << 'EOF'
          // Azure App Service entry point for Next.js standalone
          const path = require('path');
          process.chdir(path.join(__dirname, 'frontend'));
          process.env.PORT = process.env.PORT || '8080';
          process.env.HOSTNAME = '0.0.0.0';
          require('./server.js');
          EOF

          # Create web.config for IISNode (Required for Windows App Service)
          cat > deploy/web.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <handlers>
                <add name="iisnode" path="server.js" verb="*" modules="iisnode"/>
              </handlers>
              <rewrite>
                <rules>
                  <rule name="NodeInspector" patternSyntax="ECMAScript" stopProcessing="true">
                    <match url="^server.js\/debug[\/]?" />
                  </rule>
                  <rule name="StaticContent">
                    <action type="Rewrite" url="public{REQUEST_URI}"/>
                  </rule>
                  <rule name="DynamicContent">
                    <conditions>
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="True"/>
                    </conditions>
                    <action type="Rewrite" url="server.js"/>
                  </rule>
                </rules>
              </rewrite>
              <iisnode watchedFiles="web.config;*.js" node_env="production" devErrorsEnabled="true" loggingEnabled="true" logDirectory="iisnode" nodeProcessCommandLine="&quot;C:\Program Files (x86)\nodejs\node.exe&quot;" />
            </system.webServer>
          </configuration>
          EOF

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: deploy
